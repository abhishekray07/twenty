auth:
  session_command: node scripts/opslane-session.cjs
port: 3000
dockerfile: packages/twenty-docker/twenty/Dockerfile
build_target: twenty
services:
  - type: postgres
    extensions: [vector, uuid-ossp, unaccent]
  - redis
health_path: /healthz
env:
  NODE_ENV: production
  APP_SECRET: 8f1d2c3b4a5968778695a4b3c2d1e0f1a2b3c4d5e6f70819a2b3c4d5e6f70819
  SERVER_URL: http://localhost:3000
  FRONTEND_URL: http://localhost:3000
  STORAGE_TYPE: local
  PG_DATABASE_URL: postgres://app:app@pg:5432/app
  REDIS_URL: redis://redis:6379
  DISABLE_DB_MIGRATIONS: "false"
  IS_EMAIL_VERIFICATION_REQUIRED: "false"
seed: |
  set -e
  cd /app/packages/twenty-server
  has_schema=$(psql -tAc "SELECT EXISTS (SELECT 1 FROM information_schema.schemata WHERE schema_name = 'core')" ${PG_DATABASE_URL})
  if [ "$has_schema" = "f" ]; then yarn database:init:prod; fi
  yarn command:prod workspace:seed:dev --light
verify_setup:
  instructions: |
    Log in as tim@apple.dev / tim@apple.dev (the seed creates the Apple demo
    workspace via Twenty's own workspace:seed:dev command, with demo
    companies, people, opportunities, notes and tasks already present).
    Choose "Continue with Email" on the sign-in screen, enter the
    credentials, and you land directly in the workspace — no sign-up or
    onboarding is needed. Verify through the browser UI only.
notes: |
  Twenty CRM (Nx monorepo, NestJS server + React front). Dockerfile-first:
  packages/twenty-docker/twenty/Dockerfile (build target `twenty`) serves the
  built frontend and API from a single container on port 3000. The image
  entrypoint runs database migrations when DISABLE_DB_MIGRATIONS=false, so no
  explicit migrate command is declared. Recipe aliases: postgres at pg:5432
  (app/app), redis at redis:6379.