port: 3000
boot_mode: compose_then_dev
dev_command: yarn start
health_path: /healthz
install_command: curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash
  - && sudo apt-get install -y nodejs && yarn install && echo
  'NODE_ENV=development' > packages/twenty-server/.env && echo
  'PG_DATABASE_URL=postgres://postgres:postgres@localhost:5432/default' >>
  packages/twenty-server/.env && echo 'REDIS_URL=redis://localhost:6379' >>
  packages/twenty-server/.env && echo
  'APP_SECRET=2e24d06b6a57bfcd1d9a9478bc0a64d3516bb03bb2a28e9c350f765155920f7a'
  >> packages/twenty-server/.env && echo 'SIGN_IN_PREFILLED=true' >>
  packages/twenty-server/.env && echo
  'IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS=false' >>
  packages/twenty-server/.env && echo 'FRONTEND_URL=http://localhost:3001' >>
  packages/twenty-server/.env && echo
  'REACT_APP_SERVER_BASE_URL=http://localhost:3000' > packages/twenty-front/.env
schema_command: npx nx build twenty-server && npx nx run twenty-server:database:init
compose_file: packages/twenty-docker/docker-compose.dev.yml
compose_services: db redis
notes: Twenty is an open-source CRM monorepo (Nx workspace, Yarn 4, Node 24).
  Backend on port 3000, frontend on port 3001. The schema_command builds the
  NestJS server and runs all instance migration commands. The dev_command uses
  concurrently to start both twenty-server and twenty-front plus the worker.
env_vars:
  APP_SECRET: 2e24d06b6a57bfcd1d9a9478bc0a64d3516bb03bb2a28e9c350f765155920f7a
  NODE_ENV: development
